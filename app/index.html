<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeCaption</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --stage: #080b10; --panel: #141a23; --field: #0f141b; --line: #263040;
    --text: #e8edf4; --muted: #8995a8; --accent: #f5b82e; --accent-hover: #ffc94d; --accent-ink: #1a1203;
    --accent-soft: rgba(245,184,46,.12); --danger: #ff7b72; --ok: #4fd08c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled, input:disabled { cursor: not-allowed; opacity: .5; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }

  /* left: preview */
  .stage { background: var(--stage); display: flex; align-items: center; justify-content: center; padding: 24px; min-width: 0; min-height: 0; }
  .drop { width: min(520px, 100%); border: 1.5px dashed var(--line); border-radius: 16px; padding: 64px 24px; text-align: center; cursor: pointer; background: var(--panel); transition: border-color .15s, background .15s; }
  .drop:hover, .stage.over .drop { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 19px; font-weight: 650; margin-bottom: 4px; }
  .drop span { color: var(--muted); }
  .player { display: none; flex-direction: column; align-items: center; gap: 12px; max-width: 100%; max-height: 100%; }
  .frame { position: relative; line-height: 0; max-width: 100%; }
  .frame video { display: block; max-width: 100%; max-height: calc(100vh - 110px); background: #000; border-radius: 10px; }
  .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 10px; touch-action: none; }
  .stage.over .frame video { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .ctrl { display: flex; align-items: center; gap: 10px; width: min(100%, 520px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 12px 5px 5px; }
  .ctrl button { width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; }
  .ctrl button:hover { background: var(--field); }
  .ctrl input { flex: 1; accent-color: var(--accent); min-width: 0; }
  .ctrl .time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* right: controls */
  .side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }
  .head h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .body { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  .lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .lbl .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .code { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font-size: 20px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-family: Consolas, "Cascadia Mono", monospace; }
  .code:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .left { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

  .btn { width: 100%; border: 0; border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 650; background: var(--accent); color: var(--accent-ink); }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; font-size: 13.5px; padding: 8px 10px; }
  .btn.ghost:hover:not(:disabled) { background: var(--field); }
  .gen { margin-top: 10px; }

  .vids { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .vid { position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 9px 10px 10px 12px; cursor: pointer; }
  .vid.sel { border-color: var(--accent); }
  .vid .top { display: flex; align-items: center; gap: 8px; }
  .vid .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--muted); }
  .vid .st { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vid .st.ok { color: var(--ok); font-weight: 600; } .vid .st.err { color: var(--danger); font-weight: 600; }
  .vid .rm { border: 0; background: none; color: var(--muted); width: 22px; height: 22px; border-radius: 6px; font-size: 16px; line-height: 1; padding: 0; }
  .vid .rm:hover:not(:disabled) { background: var(--line); color: var(--text); }
  .vid .title { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; }
  .vid .title p { flex: 1; margin: 0; font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .vid .title p.none { color: var(--muted); font-style: italic; }
  .vid .title p b { color: var(--accent); font-weight: 650; }
  .copy { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px; font-size: 12px; }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .vid .fill { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; transition: width .2s; }

  .foot { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 9px; }
  .bar { height: 6px; background: var(--field); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: none; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .msg { font-size: 13px; color: var(--muted); min-height: 19px; overflow-wrap: anywhere; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    .frame video { max-height: calc(55vh - 110px); }
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <div class="drop" id="drop" tabindex="0" role="button">
      <strong>Add your videos</strong>
      <span>Click to choose videos, or drag and drop them here</span>
    </div>
    <div class="player" id="player">
      <div class="frame">
        <video id="video" playsinline></video>
        <canvas id="overlay" title="Drag the text up or down to move it on this video"></canvas>
      </div>
      <div class="ctrl">
        <button type="button" id="play" aria-label="Play">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
        <span class="time" id="time">0:00 / 0:00</span>
        <button type="button" id="mute" aria-label="Mute">🔊</button>
      </div>
    </div>
    <input type="file" id="file" accept="video/*,.mkv,.mov" multiple hidden>
  </main>

  <aside class="side">
    <div class="head"><div class="logo">C</div><h1>CodeCaption</h1></div>

    <div class="body">
      <div>
        <label class="lbl" for="code">Referral code</label>
        <input class="code" id="code" type="text" maxlength="20" placeholder="e.g. UMNZQ2H5" autocomplete="off" spellcheck="false">
        <button class="btn gen" id="gen" type="button">Generate</button>
        <div class="left" id="left"></div>
      </div>

      <div>
        <div class="lbl">Videos <span class="hint" id="count"></span></div>
        <ul class="vids" id="vids"></ul>
        <button class="btn ghost" id="add" type="button" style="width:100%;margin-top:8px">+ Add videos</button>
      </div>
    </div>

    <div class="foot">
      <div class="bar" id="bar"><div id="barfill"></div></div>
      <div class="msg" id="msg"></div>
      <button class="btn" id="export" disabled>Export</button>
      <button class="btn ghost" id="cancel" hidden>Cancel</button>
      <button class="btn ghost" id="openFolder" hidden>Open folder</button>
    </div>
  </aside>
</div>

<script src="captions.js"></script>
<script src="mediabunny.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), overlay = $('overlay'), msg = $('msg'), vidsEl = $('vids'), codeEl = $('code');
  const native = window.appNative || null;            // present only in the desktop app
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const CAPTIONS = window.CAPTIONS || [];
  const state = { items: [], sel: null, busy: false, cancel: null, cancelled: false, url: null, nextId: 1, lastDest: null,
    code: store.get('cc-code', '') };

  // ---------- captions: every caption is used only once, ever ----------
  // Used captions are remembered on this computer, so they never come back (even after closing the app).
  const USED_KEY = 'cc-used-' + (window.CAPTIONS_ID || 'v1');     // a new caption list starts its own record
  const used = new Set(store.get(USED_KEY, []));
  let unused = [];
  for (let i = 0; i < CAPTIONS.length; i++) if (!used.has(i)) unused.push(i);
  function takeCaption() {
    if (!unused.length) return null;
    const k = Math.floor(Math.random() * unused.length);
    const idx = unused[k];
    unused[k] = unused[unused.length - 1]; unused.pop();
    used.add(idx);
    return idx;
  }
  const saveUsed = () => store.set(USED_KEY, [...used]);
  const codeText = () => state.code || 'CODE';
  const captionText = it => it.caption == null ? '' : CAPTIONS[it.caption].replace(/\{CODE\}/g, codeText());
  // ---------- caption position: a different spot on the screen for each video ----------
  // Spots go from near the top to above the bottom (kept clear of YouTube's buttons at the very bottom).
  // They are dealt from a shuffled deck that is remembered, so the next batch keeps getting new spots.
  const SPOTS = [0.14, 0.22, 0.30, 0.38, 0.46, 0.54, 0.62, 0.70, 0.78];
  let deck = store.get('cc-spots', []).filter(v => SPOTS.includes(v));
  function takeSpot() {
    if (!deck.length) {
      deck = SPOTS.slice();
      for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    }
    const v = deck.shift();
    store.set('cc-spots', deck);
    return clamp(v + (Math.random() - 0.5) * 0.05, 0.1, 0.82);     // small extra shift so no two are exactly the same
  }
  const itemY = it => (it && it.y != null) ? it.y : 0.5;

  // ---------- caption colors: a different look for each video, dealt the same way as the spots ----------
  const STYLES = [
    { text: '#ffffff', code: '#ffd23f', outline: '#000000' },
    { text: '#ffffff', code: '#3dff8f', outline: '#000000' },
    { text: '#ffe14d', code: '#ffffff', outline: '#000000' },
    { text: '#ffffff', code: '#4fd8ff', outline: '#000000' },
    { text: '#ffffff', code: '#ff5c8a', outline: '#000000' },
    { text: '#111111', code: '#c4001d', box: '#ffd23f' },
    { text: '#ffffff', code: '#ffd23f', box: 'rgba(0,0,0,.78)' },
    { text: '#ffffff', code: '#ffe14d', box: '#e8283c' },
    { text: '#ffffff', code: '#ffe14d', box: '#5b3df5' },
    { text: '#111111', code: '#0a6cff', box: '#ffffff' },
    { text: '#0b1d12', code: '#ffffff', box: '#2fd16f' },
  ];
  let styleDeck = store.get('cc-styles', []).filter(v => v >= 0 && v < STYLES.length);
  function takeStyle() {
    if (!styleDeck.length) {
      styleDeck = STYLES.map((_, i) => i);
      for (let i = styleDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [styleDeck[i], styleDeck[j]] = [styleDeck[j], styleDeck[i]]; }
    }
    const v = styleDeck.shift();
    store.set('cc-styles', styleDeck);
    return v;
  }
  const itemStyle = it => STYLES[(it && it.style != null) ? it.style : 0];

  function showLeft() {
    $('left').textContent = `${unused.length.toLocaleString('en-US')} of ${CAPTIONS.length.toLocaleString('en-US')} captions left`;
  }

  // ---------- drawing the caption (same code for the preview and the exported video) ----------
  const FONT = '"Segoe UI", "Segoe UI Emoji", Arial, sans-serif';
  const EMOJI = /(\p{Extended_Pictographic}️?)/u;
  function wrapLines(ctx, text, maxW) {
    const words = text.trim().split(/\s+/).filter(Boolean), out = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (!line || ctx.measureText(test).width <= maxW) line = test;
      else { out.push(line); line = w; }
    }
    if (line) out.push(line);
    return out;
  }
  // Splits a line into pieces so the code can be colored and emoji are not outlined.
  function pieces(line, code) {
    const out = [];
    const parts = code ? line.split(code) : [line];
    parts.forEach((p, i) => {
      for (const s of p.split(EMOJI)) if (s) out.push({ s, kind: EMOJI.test(s) ? 'emoji' : 'text' });
      if (i < parts.length - 1) out.push({ s: code, kind: 'code' });
    });
    return out;
  }
  // Paints the caption on a transparent canvas of the video's size. Returns the box it covers.
  function paintCaption(ctx, W, H, text, code, yFrac, st) {
    st = st || STYLES[0];
    if (!text) return null;
    const portrait = H >= W;
    const fs = Math.max(14, Math.round(W * (portrait ? 0.062 : 0.042)));
    ctx.font = `700 ${fs}px ${FONT}`;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const lines = wrapLines(ctx, text, W * 0.86);
    const lh = fs * 1.3, bh = lines.length * lh;
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
    const top = clamp(yFrac * H - bh / 2, H * 0.03, H * 0.97 - bh);
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, fs * 0.17); ctx.strokeStyle = st.outline || '#000';
    const shadow = on => {
      ctx.shadowColor = on ? 'rgba(0,0,0,.5)' : 'transparent';
      ctx.shadowBlur = on ? fs * 0.2 : 0; ctx.shadowOffsetY = on ? fs * 0.06 : 0;
    };
    lines.forEach((line, i) => {
      const y = top + lh * i + lh / 2;
      const ps = pieces(line, code);
      const lw = ctx.measureText(line).width;
      if (st.box) {                                   // a rounded box behind each line
        const px = fs * 0.32, py = fs * 0.1;
        shadow(true); ctx.fillStyle = st.box; ctx.beginPath();
        const bx = (W - lw) / 2 - px, by = y - lh / 2 + py * 0.3, bw2 = lw + px * 2, bh2 = lh - py * 0.6;
        if (ctx.roundRect) ctx.roundRect(bx, by, bw2, bh2, fs * 0.22); else ctx.rect(bx, by, bw2, bh2);
        ctx.fill(); shadow(false);
      } else {
        shadow(true);
        let x = (W - lw) / 2;
        for (const p of ps) { if (p.kind !== 'emoji') ctx.strokeText(p.s, x, y); x += ctx.measureText(p.s).width; }
        shadow(false);
      }
      let x = (W - lw) / 2;
      for (const p of ps) {
        ctx.fillStyle = p.kind === 'code' ? st.code : st.text;
        ctx.fillText(p.s, x, y);
        x += ctx.measureText(p.s).width;
      }
    });
    shadow(false);
    return { x: (W - widest) / 2, y: top, w: widest, h: bh };
  }
  function renderCaption(text, code, W, H, yFrac, st) {
    const c = new OffscreenCanvas(W, H);
    const box = paintCaption(c.getContext('2d'), W, H, text, code, yFrac, st);
    return box ? { canvas: c, box } : null;
  }

  // ---------- preview ----------
  let box = null;
  function draw() {
    const W = overlay.width, H = overlay.height;
    if (!W) return;
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    const it = curItem();
    box = it ? paintCaption(ctx, W, H, captionText(it), codeText(), itemY(it), itemStyle(it)) : null;
    if (it && it.caption == null && !state.busy) {         // hint inside the preview
      const fs = Math.round(W * 0.035);
      ctx.font = `600 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0.5 * H - fs, W, fs * 2);
      ctx.fillStyle = '#fff'; ctx.fillText('Press Generate to add the caption', W / 2, 0.5 * H);
    }
  }
  let rafOn = false;
  function loop() { draw(); syncTime(); if (!video.paused && !video.ended) requestAnimationFrame(loop); else rafOn = false; }
  function startLoop() { if (!rafOn) { rafOn = true; requestAnimationFrame(loop); } }

  // drag the caption up or down
  const toVideoY = e => { const r = overlay.getBoundingClientRect(); return (e.clientY - r.top) / r.height; };
  let drag = null;
  overlay.addEventListener('pointerdown', e => {
    if (state.busy || e.button !== 0) return;
    const r = overlay.getBoundingClientRect();
    const py = (e.clientY - r.top) / r.height * overlay.height, px = (e.clientX - r.left) / r.width * overlay.width;
    if (box && py >= box.y - 10 && py <= box.y + box.h + 10 && px >= box.x - 10 && px <= box.x + box.w + 10) {
      video.pause();
      drag = { it: curItem(), off: toVideoY(e) - itemY(curItem()) };
      overlay.setPointerCapture(e.pointerId);
    } else togglePlay();
  });
  overlay.addEventListener('pointermove', e => {
    if (!drag) {
      const r = overlay.getBoundingClientRect(), py = (e.clientY - r.top) / r.height * overlay.height;
      overlay.style.cursor = box && py >= box.y - 10 && py <= box.y + box.h + 10 ? 'ns-resize' : 'default';
      return;
    }
    if (drag.it) drag.it.y = clamp(toVideoY(e) - drag.off, 0.05, 0.95);
    draw();
  });
  const endDrag = () => { drag = null; };
  overlay.addEventListener('pointerup', endDrag);
  overlay.addEventListener('pointercancel', endDrag);

  // player controls
  const fmt = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
  let seeking = false;
  function syncTime() {
    const d = isFinite(video.duration) ? video.duration : 0;
    if (!seeking) $('seek').value = d ? Math.round(video.currentTime / d * 1000) : 0;
    $('time').textContent = fmt(video.currentTime) + ' / ' + fmt(d);
    $('play').textContent = video.paused || video.ended ? '▶' : '❚❚';
  }
  function togglePlay() { if (state.busy || !video.getAttribute('src')) return; if (video.paused || video.ended) video.play().catch(() => {}); else video.pause(); }
  $('play').addEventListener('click', togglePlay);
  $('mute').addEventListener('click', () => { video.muted = !video.muted; $('mute').textContent = video.muted ? '🔇' : '🔊'; });
  $('seek').addEventListener('input', () => { seeking = true; if (isFinite(video.duration)) video.currentTime = $('seek').value / 1000 * video.duration; });
  $('seek').addEventListener('change', () => { seeking = false; });
  for (const ev of ['play', 'playing']) video.addEventListener(ev, startLoop);
  for (const ev of ['pause', 'ended', 'seeked', 'timeupdate', 'loadeddata']) video.addEventListener(ev, () => { draw(); syncTime(); });

  // ---------- referral code and Generate ----------
  codeEl.value = state.code;
  codeEl.addEventListener('input', () => {
    const v = codeEl.value.toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    if (v !== codeEl.value) codeEl.value = v;
    state.code = v; store.set('cc-code', v);
    renderList();
  });
  $('gen').addEventListener('click', () => {
    if (state.busy) return;
    if (!state.code) { setMsg('Type your referral code first.', 'err'); codeEl.focus(); return; }
    if (!state.items.length) { setMsg('Add your videos first.', 'err'); return; }
    // Videos without a caption get one. If every video already has one, they all get new ones.
    const targets = state.items.some(it => it.caption == null) ? state.items.filter(it => it.caption == null) : state.items;
    let given = 0;
    for (const it of targets) {
      const idx = takeCaption();
      if (idx == null) break;
      it.caption = idx; it.y = takeSpot(); it.style = takeStyle(); it.status = 'ready'; given++;
    }
    saveUsed(); showLeft();
    if (given < targets.length) setMsg('All captions have been used. Ask for a new caption list.', 'err');
    else setMsg('');
    $('openFolder').hidden = true;
    renderList();
  });

  // ---------- video list ----------
  const curItem = () => state.items.find(x => x.id === state.sel) || null;
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    }
  }
  function titleHtml(p, it) {
    p.textContent = '';
    if (it.caption == null) { p.className = 'none'; p.textContent = 'No caption yet. Press Generate.'; return; }
    p.className = '';
    const parts = CAPTIONS[it.caption].split('{CODE}');
    parts.forEach((s, i) => { p.append(s); if (i < parts.length - 1) { const b = document.createElement('b'); b.textContent = codeText(); p.append(b); } });
  }
  function renderList() {
    vidsEl.textContent = '';
    for (const it of state.items) {
      const li = document.createElement('li');
      li.className = 'vid' + (it.id === state.sel ? ' sel' : '');
      li.title = it.error || it.file.name;
      const top = document.createElement('div'); top.className = 'top';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = it.file.name;
      const st = document.createElement('span');
      st.className = 'st' + (it.status === 'done' ? ' ok' : it.status === 'error' ? ' err' : '');
      st.textContent = it.status === 'done' ? 'Done' : it.status === 'error' ? 'Failed' : it.status === 'working' ? Math.round(it.progress * 100) + '%' : it.status === 'queued' ? 'Waiting' : '';
      const rm = document.createElement('button'); rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×';
      rm.setAttribute('aria-label', 'Remove ' + it.file.name); rm.disabled = state.busy;
      rm.addEventListener('click', e => { e.stopPropagation(); removeItem(it.id); });
      top.append(name, st, rm);
      const title = document.createElement('div'); title.className = 'title';
      const p = document.createElement('p'); titleHtml(p, it); title.append(p);
      if (it.caption != null) {
        const cp = document.createElement('button'); cp.className = 'copy'; cp.type = 'button'; cp.textContent = 'Copy title';
        cp.addEventListener('click', async e => {
          e.stopPropagation();
          if (await copyText(captionText(it))) { cp.textContent = 'Copied'; setTimeout(() => { cp.textContent = 'Copy title'; }, 1400); }
        });
        title.append(cp);
      }
      const fill = document.createElement('div'); fill.className = 'fill';
      fill.style.width = it.status === 'working' ? (it.progress * 100).toFixed(1) + '%' : '0';
      li.append(top, title, fill);
      li.addEventListener('click', () => select(it.id));
      vidsEl.appendChild(li);
    }
    refresh();
  }
  function refresh() {
    draw();
    const n = state.items.length;
    $('count').textContent = n ? `${n} added` : '';
    const ready = n && state.code && state.items.every(it => it.caption != null);
    $('export').disabled = state.busy || !ready;
    $('export').textContent = n > 1 ? `Export ${n} videos` : 'Export video';
    $('gen').disabled = state.busy;
    $('gen').textContent = n && state.items.every(it => it.caption != null) ? 'Generate new captions' : 'Generate';
    codeEl.disabled = state.busy;
    $('add').disabled = state.busy;
  }
  function select(id) {
    const it = state.items.find(x => x.id === id);
    if (!it) return;
    if (state.sel !== id) {
      state.sel = id;
      if (state.url) URL.revokeObjectURL(state.url);
      state.url = URL.createObjectURL(it.file);
      video.src = state.url;
    }
    $('drop').style.display = 'none';
    $('player').style.display = 'flex';
    renderList();
  }
  function addFiles(files) {
    if (state.busy) return;
    const all = Array.from(files || []);
    const vids = all.filter(f => f.type.startsWith('video/') || /\.(mp4|mov|mkv|webm|m4v|avi|ts)$/i.test(f.name));
    if (!vids.length) { if (all.length) setMsg('Those files are not videos.', 'err'); return; }
    for (const file of vids) state.items.push({ id: state.nextId++, file, caption: null, status: 'ready', progress: 0, error: '' });
    setMsg(''); $('openFolder').hidden = true;
    if (state.sel == null) select(state.items[0].id); else renderList();
  }
  function removeItem(id) {
    if (state.busy) return;
    state.items = state.items.filter(x => x.id !== id);
    if (state.sel === id) {
      state.sel = null;
      if (state.items.length) select(state.items[0].id);
      else {
        video.removeAttribute('src'); video.load();
        if (state.url) { URL.revokeObjectURL(state.url); state.url = null; }
        overlay.width = 0;
        $('player').style.display = 'none'; $('drop').style.display = '';
      }
    }
    renderList();
  }
  video.addEventListener('loadedmetadata', () => {
    overlay.width = video.videoWidth || 1080; overlay.height = video.videoHeight || 1920;
    syncTime(); refresh();
  });
  video.addEventListener('error', () => {
    if (!video.getAttribute('src')) return;
    if (!overlay.width) { overlay.width = 1080; overlay.height = 1920; }
    setMsg('This video cannot be previewed, but exporting may still work.');
    refresh();
  });

  const fileInput = $('file'), stage = $('stage');
  const pick = () => { if (!state.busy) fileInput.click(); };
  $('drop').addEventListener('click', pick);
  $('drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  $('add').addEventListener('click', pick);
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  document.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('over'); });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) stage.classList.remove('over'); });
  document.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('over'); addFiles(e.dataTransfer.files); });

  // ---------- exporting ----------
  function setMsg(t, cls) { msg.textContent = t || ''; msg.className = 'msg' + (cls ? ' ' + cls : ''); }
  function setBusy(b) {
    state.busy = b;
    $('bar').style.display = b ? 'block' : 'none';
    $('cancel').hidden = !b;
    renderList();
  }
  // File name = the caption (characters Windows does not allow are removed).
  const fileBase = text => text.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').replace(/[.\s]+$/, '').trim().slice(0, 150) || 'video';
  function freeName(usedNames, base) {
    for (let i = 1; ; i++) {
      const name = `${base}${i > 1 ? ` (${i})` : ''}.mp4`;
      if (!usedNames.has(name.toLowerCase())) { usedNames.add(name.toLowerCase()); return name; }
    }
  }
  async function chooseDest(MB) {
    const usedNames = new Set();
    if (native) {
      const dir = await native.pickFolder();
      if (!dir) return null;
      return {
        label: `the "${dir.split(/[\\/]/).filter(Boolean).pop() || dir}" folder`, open: () => native.openFolder(dir),
        async create(base) {
          const f = await native.createFile(dir, base + '.mp4');
          const writable = new WritableStream({ write: c => native.write(f.id, c.data, c.position), close: () => native.close(f.id), abort: () => native.discard(f.id) });
          return { name: f.name, target: new MB.StreamTarget(writable, { chunked: true }), finish: async () => {}, discard: () => native.discard(f.id) };
        },
      };
    }
    if (window.showDirectoryPicker) {
      let dir = null;
      try { dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'codecaption-out' }); }
      catch (e) { if (e && e.name === 'AbortError') return null; }
      if (dir) return {
        label: dir.name ? `the "${dir.name}" folder` : 'the folder you chose',
        async create(base) {
          let name;
          for (;;) { name = freeName(usedNames, base); try { await dir.getFileHandle(name); } catch (e) { break; } }
          const handle = await dir.getFileHandle(name, { create: true });
          const writable = await handle.createWritable();
          return { name, target: new MB.StreamTarget(writable, { chunked: true }), finish: async () => {},
            discard: async () => { try { await writable.abort(); } catch (_) {} try { await dir.removeEntry(name); } catch (_) {} } };
        },
      };
    }
    return {
      label: 'your Downloads folder',
      async create(base) {
        const name = freeName(usedNames, base), target = new MB.BufferTarget();
        return { name, target, discard: async () => {}, finish: async () => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([target.buffer], { type: 'video/mp4' })); a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
        } };
      },
    };
  }

  async function exportOne(MB, it, text, code, yFrac, st, dest, onProgress) {
    let out = null, input = null;
    try {
      input = new MB.Input({ source: new MB.BlobSource(it.file), formats: MB.ALL_FORMATS });
      const track = await input.getPrimaryVideoTrack();
      if (!track) throw new Error('No video track found in this file.');
      const W = track.displayWidth, H = track.displayHeight;
      let bitrate = MB.QUALITY_HIGH;
      try {
        const stats = await track.computePacketStats(150);
        if (stats && stats.averageBitrate > 0) bitrate = Math.round(clamp(stats.averageBitrate * 1.15, 1.5e6, 60e6));
      } catch (_) {}

      const cap = renderCaption(text, code, W, H, yFrac, st);
      const frame = new OffscreenCanvas(W, H);
      const fctx = frame.getContext('2d', { alpha: false });

      out = await dest.create(fileBase(text));
      const output = new MB.Output({ format: new MB.Mp4OutputFormat(), target: out.target });
      // File details (metadata), all true for this video: its caption, the code, the source file and the export time.
      const now = new Date();
      const tags = {
        title: text,
        comment: `Referral code: ${code} | Source file: ${it.file.name}`,
        description: text,
        date: now,
        creationTime: now,
        raw: { '\u00A9too': 'CodeCaption' },
      };
      const conversion = await MB.Conversion.init({
        input, output, tags: () => tags,
        video: {
          bitrate, forceTranscode: true, allowTransformationMetadata: false, processedWidth: W, processedHeight: H,
          process: sample => { sample.draw(fctx, 0, 0, W, H); if (cap) fctx.drawImage(cap.canvas, 0, 0); return frame; },
        },
      });
      if (!conversion.isValid) throw new Error('This video format cannot be processed on this computer.');
      conversion.onProgress = onProgress;
      state.cancel = () => conversion.cancel();
      if (state.cancelled) throw new Error('cancelled');
      await conversion.execute();
      if (state.cancelled) throw new Error('cancelled');
      await out.finish();
      return out.name;
    } catch (e) {
      if (out) { try { await out.discard(); } catch (_) {} }
      throw e;
    } finally {
      state.cancel = null;
      try { input && input.dispose && input.dispose(); } catch (_) {}
    }
  }

  async function exportAll() {
    if (state.busy || !state.items.length) return;
    if (typeof Mediabunny === 'undefined' || typeof VideoEncoder === 'undefined') {
      setMsg('Video export is not supported here. Open the app in Google Chrome or Microsoft Edge.', 'err'); return;
    }
    const items = state.items.slice();
    let dest;
    try { dest = await chooseDest(Mediabunny); } catch (e) { setMsg('Could not open that folder: ' + (e.message || e), 'err'); return; }
    if (!dest) return;

    state.cancelled = false; state.lastDest = null; $('openFolder').hidden = true;
    for (const it of items) { it.status = 'queued'; it.progress = 0; it.error = ''; }
    video.pause();
    setBusy(true);
    let done = 0, failed = 0;
    const total = items.length, code = codeText();
    const overall = p => { $('barfill').style.width = ((done + failed + p) / total * 100).toFixed(1) + '%'; };
    overall(0);
    for (let i = 0; i < total; i++) {
      const it = items[i];
      if (state.cancelled) { it.status = 'ready'; continue; }
      it.status = 'working'; renderList();
      setMsg(total > 1 ? `Exporting video ${i + 1} of ${total}…` : 'Exporting…');
      try {
        await exportOne(Mediabunny, it, captionText(it), code, itemY(it), itemStyle(it), dest, p => {
          it.progress = p; overall(p);
          const li = vidsEl.children[state.items.indexOf(it)];
          if (li) { li.querySelector('.st').textContent = Math.round(p * 100) + '%'; li.querySelector('.fill').style.width = (p * 100).toFixed(1) + '%'; }
        });
        it.status = 'done'; done++;
      } catch (e) {
        if (state.cancelled) it.status = 'ready';
        else { console.error(e); it.status = 'error'; it.error = (e && e.message) || String(e); failed++; }
      }
      overall(0); renderList();
    }
    setBusy(false);
    if (done && dest.open) { state.lastDest = dest; $('openFolder').hidden = false; }
    if (state.cancelled) setMsg(done ? `Cancelled. ${done} of ${total} saved to ${dest.label}.` : 'Cancelled.');
    else if (failed && !done) setMsg(total > 1 ? 'None of the videos could be exported. Hover a video to see why.' : 'Export failed: ' + items[0].error, 'err');
    else if (failed) setMsg(`${done} saved to ${dest.label}, ${failed} failed. Hover a failed video to see why.`, 'err');
    else setMsg(total > 1 ? `All ${done} videos saved to ${dest.label}.` : `Saved to ${dest.label}.`, 'ok');
  }

  $('export').addEventListener('click', exportAll);
  $('cancel').addEventListener('click', () => {
    state.cancelled = true; setMsg('Cancelling…');
    if (state.cancel) Promise.resolve(state.cancel()).catch(() => {});
  });
  $('openFolder').addEventListener('click', () => { if (state.lastDest && state.lastDest.open) state.lastDest.open(); });
  window.addEventListener('beforeunload', e => { if (state.busy) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- start ----------
  showLeft(); renderList();
  window.__cc = { state, CAPTIONS };       // used by automated tests only
})();
</script>
</body>
</html>
