<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoText</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f5f9; --stage: #e6eaf1; --panel: #ffffff; --field: #f6f8fb; --line: #d9dfe9;
    --text: #131a26; --muted: #5d6b80; --accent: #2f5bea; --accent-hover: #2449c4; --accent-ink: #ffffff;
    --accent-soft: rgba(47,91,234,.10); --danger: #cf3a3a; --ok: #178a52; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  :root[data-theme=dark] {
    color-scheme: dark;
    --bg: #0e1218; --stage: #090c11; --panel: #151b24; --field: #0f141b; --line: #273140;
    --text: #e7ecf3; --muted: #8e9bb0; --accent: #6b8cff; --accent-hover: #86a1ff; --accent-ink: #0a1022;
    --accent-soft: rgba(107,140,255,.14); --danger: #ff7b72; --ok: #4fd08c; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  }
  button, textarea, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .55; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 100vh; }
  .stage { background: var(--stage); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .view { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; min-width: 0; min-height: 0; }
  .vbar { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .vbar .btn { flex: none; white-space: nowrap; }
  .sep { border-top: 1px solid var(--line); padding-top: 14px; }
  .side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .head h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; flex: 1; }
  .theme { border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
  .theme:hover { color: var(--text); }
  .body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .foot { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 9px; }

  .lbl, summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .lbl .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .link { text-transform: none; letter-spacing: 0; font-weight: 500; background: none; border: 0; color: var(--accent); padding: 0; font-size: 13px; }
  details { border-top: 1px solid var(--line); padding-top: 12px; }
  details > summary { cursor: pointer; margin-bottom: 0; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "+"; font-size: 16px; font-weight: 400; }
  details[open] > summary::after { content: "–"; }
  details[open] > summary { margin-bottom: 10px; }
  .grp { display: flex; flex-direction: column; gap: 8px; }
  .grp > .lbl { margin-bottom: 0; }
  #props { display: flex; flex-direction: column; gap: 16px; }

  .drop {
    width: min(540px, 100%); border: 1.5px dashed var(--line); border-radius: 14px; padding: 54px 24px; background: var(--panel);
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .stage.over .drop { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 18px; font-weight: 650; margin-bottom: 4px; }
  .drop span { color: var(--muted); }

  .player { display: none; flex-direction: column; gap: 10px; max-width: 100%; max-height: 100%; align-items: center; }
  .frame { position: relative; line-height: 0; max-width: 100%; }
  .frame video { display: block; max-width: 100%; max-height: calc(100vh - 210px); background: #000; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: default; border-radius: 8px; }
  .ctrl { display: flex; align-items: center; gap: 10px; width: min(100%, 560px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px 6px 6px; }
  .ctrl button { width: 32px; height: 32px; border-radius: 7px; border: 0; background: transparent; display: grid; place-items: center; font-size: 14px; }
  .ctrl button:hover { background: var(--field); }
  .ctrl input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .ctrl .time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  textarea, select, input[type=number], input[type=text] {
    background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0;
  }
  textarea { width: 100%; min-height: 76px; resize: vertical; font-size: 15px; padding: 9px 11px; }
  textarea:focus, select:focus, input[type=number]:focus, input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select { flex: 1; }
  input[type=number] { width: 68px; }
  input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  input[type=color] { width: 38px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); cursor: pointer; flex: none; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .mini { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 13.5px; width: 104px; flex: none; cursor: pointer; }
  .tog { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--field); border-radius: 8px; flex: none; font-size: 15px; font-family: Georgia, serif; }
  .tog[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 5px 6px 5px 10px; font-size: 13px; max-width: 100%; cursor: pointer; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .chip.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip .x { border: 0; background: none; color: var(--muted); width: 20px; height: 20px; border-radius: 5px; padding: 0; line-height: 1; font-size: 15px; }
  .chip .x:hover { background: var(--line); color: var(--text); }
  .chip.add { border-style: dashed; color: var(--muted); padding: 5px 10px; }
  .chip.add:hover { color: var(--accent); border-color: var(--accent); }

  .pos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pos.four { grid-template-columns: repeat(2, 1fr); }
  .pos button { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 7px 4px; font-size: 13px; }
  .pos button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg { display: flex; flex: 1; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; background: transparent; border: 0; border-radius: 6px; padding: 4px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; max-height: 78px; overflow-y: auto; }
  .list li {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--field); border-radius: 9px; padding: 4px 6px 4px 11px; cursor: pointer;
    position: relative; overflow: hidden; max-width: 260px;
  }
  .list li.sel { border-color: var(--accent); background: var(--accent-soft); }
  .list .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .list .st { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .list .st.ok { color: var(--ok); font-weight: 600; } .list .st.err { color: var(--danger); font-weight: 600; }
  .list .rm { border: 0; background: none; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; font-size: 16px; line-height: 1; }
  .list .rm:hover:not(:disabled) { background: var(--line); color: var(--text); }
  .list .fill { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; transition: width .2s; }

  .btn { width: 100%; border: 0; border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 650; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; font-size: 13.5px; padding: 7px 10px; box-shadow: none; width: auto; }
  .btn.ghost:hover:not(:disabled) { background: var(--field); }
  .btn.wide { width: 100%; }
  .bar { height: 6px; background: var(--field); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); display: none; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .msg { font-size: 13px; color: var(--muted); min-height: 19px; overflow-wrap: anywhere; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
  [hidden] { display: none !important; }

  @media (max-width: 880px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46vh auto; height: auto; min-height: 100vh; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    .frame video { max-height: calc(46vh - 190px); }
  }
</style>
<script>
  // Theme: follows Windows light/dark automatically unless the user picks one.
  (function () {
    var saved = null; try { saved = localStorage.getItem('vt-theme'); } catch (e) {}
    window.__vtMode = saved === 'light' || saved === 'dark' ? saved : 'auto';
    window.__vtApply = function () {
      var dark = window.__vtMode === 'dark' || (window.__vtMode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    };
    window.__vtApply();
  })();
</script>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <div class="vbar" id="vbar" hidden>
      <ul class="list" id="list"></ul>
      <button class="btn ghost" id="add" type="button">+ Add videos</button>
    </div>
    <div class="view">
    <div class="drop" id="drop" tabindex="0" role="button">
      <strong>Add your videos</strong>
      <span>Click to choose one or more videos, or drag and drop them here</span>
    </div>
    <div class="player" id="player">
      <div class="frame">
        <video id="video" playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="ctrl">
        <button type="button" id="play" aria-label="Play">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
        <span class="time" id="time">0:00 / 0:00</span>
        <button type="button" id="mute" aria-label="Mute">🔊</button>
      </div>
    </div>
    </div>
    <input type="file" id="file" accept="video/*,.mkv,.mov" multiple hidden>
    <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
  </main>

  <aside class="side">
    <div class="head">
      <div class="logo">T</div>
      <h1>VideoText</h1>
      <button class="theme" id="theme" type="button" title="Switch color theme">Theme: Auto</button>
    </div>

    <div class="body" id="body">
      <div class="grp">
        <div class="lbl">Layers</div>
        <div class="chips" id="layers"></div>
      </div>

      <div id="props"></div>

    </div>

    <div class="foot">
      <div class="grp">
        <div class="lbl">Export settings</div>
        <div class="row"><span class="mini" style="width:72px">File name</span>
          <input type="text" id="outName" placeholder="Empty = keep each video's own name" maxlength="60" style="flex:1">
        </div>
        <div class="mini" id="nameSample"></div>
        <div class="row"><span class="mini" style="width:72px">Quality</span>
          <select id="quality">
            <option value="original">Same as original</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="small">Small file</option>
          </select>
        </div>
      </div>
      <div class="bar" id="bar"><div id="barfill"></div></div>
      <div class="msg" id="msg"></div>
      <button class="btn" id="export" disabled>Export</button>
      <button class="btn ghost wide" id="cancel" hidden>Cancel</button>
      <button class="btn ghost wide" id="openFolder" hidden>Open folder</button>
    </div>
  </aside>
</div>

<script src="mediabunny.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), overlay = $('overlay'), msg = $('msg'), listEl = $('list'), propsEl = $('props');
  const native = window.videotextNative || null;      // present only in the desktop app
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const state = {
    items: [], sel: null, layers: [], selLayer: null, busy: false, cancel: null, cancelled: false, url: null, nextId: 1,
    quality: store.get('vt-quality', 'original'), outName: '', lastDest: null,
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const FALLBACK = '"Segoe UI", "Nirmala UI", "Noto Sans Bengali", Arial, sans-serif';

  // ---------- theme ----------
  const themeBtn = $('theme');
  const showTheme = () => { themeBtn.textContent = 'Theme: ' + ({ auto: 'Auto', light: 'Light', dark: 'Dark' })[window.__vtMode]; };
  themeBtn.addEventListener('click', () => {
    window.__vtMode = ({ auto: 'light', light: 'dark', dark: 'auto' })[window.__vtMode];
    try { localStorage.setItem('vt-theme', window.__vtMode); } catch (e) {}
    window.__vtApply(); showTheme();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => window.__vtApply());
  showTheme();

  // ---------- fonts ----------
  const CURATED = ['Segoe UI', 'Arial', 'Calibri', 'Verdana', 'Tahoma', 'Trebuchet MS', 'Bahnschrift', 'Impact', 'Georgia', 'Times New Roman',
    'Cambria', 'Comic Sans MS', 'Courier New', 'Consolas', 'Nirmala UI', 'Vrinda', 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali',
    'Noto Sans Bengali', 'Hind Siliguri', 'Inter', 'Roboto', 'Open Sans', 'Montserrat', 'Poppins', 'Helvetica Neue', 'DejaVu Sans', 'Liberation Sans'];
  const probe = document.createElement('canvas').getContext('2d');
  function fontInstalled(name) {
    const sample = 'mmmmmmmmlliWW@# অআক';
    return ['monospace', 'serif'].some(base => {
      probe.font = `40px ${base}`; const a = probe.measureText(sample).width;
      probe.font = `40px "${name}", ${base}`; return probe.measureText(sample).width !== a;
    });
  }
  let fonts = CURATED.filter(fontInstalled);
  if (!fonts.length) fonts = ['sans-serif'];
  let allFontsLoaded = false;
  async function loadAllFonts() {
    if (allFontsLoaded || !window.queryLocalFonts) return false;
    try {
      const list = await window.queryLocalFonts();
      const fam = [...new Set(list.map(f => f.family))].sort((a, b) => a.localeCompare(b));
      if (fam.length) { fonts = fam; allFontsLoaded = true; fillFonts(); return true; }
    } catch (e) {}
    return false;
  }
  function fillFonts() {
    const sel = propsEl.querySelector('[data-k=font]'); if (!sel) return;
    const L = curLayer(); const names = fonts.slice();
    if (L && L.font && !names.includes(L.font)) names.unshift(L.font);
    sel.textContent = '';
    for (const n of names) { const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); }
    if (L) sel.value = L.font;
    const b = $('allFonts'); if (b) b.hidden = allFontsLoaded || !window.queryLocalFonts;
  }

  // ---------- layers ----------
  const STYLE_KEYS = ['font', 'bold', 'italic', 'size', 'color', 'align', 'anchor', 'x', 'y', 'outline', 'outlineColor', 'outlineWidth',
    'shadow', 'box', 'boxColor', 'boxOpacity', 'timed', 'start', 'end', 'fadeIn', 'fadeOut'];
  const NUMERIC = new Set(['size', 'outlineWidth', 'boxOpacity', 'start', 'end', 'fadeIn', 'fadeOut', 'opacity']);
  function newText() {
    return { id: state.nextId++, type: 'text', text: '', font: fonts[0], bold: true, italic: false, size: 5.5, color: '#ffffff', align: 'center',
      anchor: 'bottom', x: .5, y: .5, outline: true, outlineColor: '#000000', outlineWidth: 16, shadow: false,
      box: false, boxColor: '#000000', boxOpacity: 70, timed: false, start: 0, end: '', fadeIn: 0, fadeOut: 0 };
  }
  function newLogo(img, name) {
    return { id: state.nextId++, type: 'logo', img, name, size: 16, opacity: 100, anchor: 'tr', x: .5, y: .5,
      timed: false, start: 0, end: '', fadeIn: 0, fadeOut: 0 };
  }
  const curLayer = () => state.layers.find(l => l.id === state.selLayer) || null;
  const layerHasContent = L => L.type === 'logo' ? !!L.img : !!L.text.trim();
  function layerName(L) {
    if (L.type === 'logo') return 'Logo';
    const n = state.layers.filter(l => l.type === 'text').indexOf(L) + 1;
    const t = L.text.trim().replace(/\s+/g, ' ');
    return t ? t : 'Text ' + n;
  }

  // ---------- drawing (the same code draws the preview and the exported frames) ----------
  const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  const graphemes = s => segmenter ? Array.from(segmenter.segment(s), x => x.segment) : Array.from(s);

  function wrapLines(ctx, text, maxW) {
    const out = [];
    for (const para of text.replace(/\r/g, '').split('\n')) {
      const words = para.trim().split(/\s+/).filter(Boolean);
      if (!words.length) { out.push(''); continue; }
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width <= maxW) { line = test; continue; }
        if (line) { out.push(line); line = ''; }
        if (ctx.measureText(word).width <= maxW) { line = word; continue; }
        let part = '';                                  // a single word wider than the video
        for (const g of graphemes(word)) {
          if (part && ctx.measureText(part + g).width > maxW) { out.push(part); part = g; }
          else part += g;
        }
        line = part;
      }
      out.push(line);
    }
    while (out.length && out[out.length - 1] === '') out.pop();
    while (out.length && out[0] === '') out.shift();
    return out;
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }
  // Where a box of bw×bh goes for this layer. Returns its top-left corner.
  function place(L, W, H, bw, bh) {
    let left, top;
    const mx = W * 0.04, my = H * 0.06;
    if (L.anchor === 'custom') { left = L.x * W - bw / 2; top = L.y * H - bh / 2; }
    else if (L.type === 'logo') {
      const m = W * 0.035;
      left = L.anchor[1] === 'l' ? m : W - m - bw;
      top = L.anchor[0] === 't' ? m : H - m - bh;
    } else {
      left = L.align === 'left' ? mx : L.align === 'right' ? W - mx - bw : (W - bw) / 2;
      top = L.anchor === 'top' ? my : L.anchor === 'middle' ? (H - bh) / 2 : H - my - bh;
    }
    return [clamp(left, Math.min(0, W - bw), Math.max(0, W - bw)), clamp(top, Math.min(0, H - bh), Math.max(0, H - bh))];
  }
  function paintText(ctx, W, H, L) {
    const text = L.text.trim();
    if (!text) return null;
    const fs = Math.max(8, Math.round(W * L.size / 100));
    ctx.font = `${L.italic ? 'italic ' : ''}${L.bold ? 700 : 400} ${fs}px "${L.font}", ${FALLBACK}`;
    ctx.textBaseline = 'middle';
    const lines = wrapLines(ctx, text, W * 0.9);
    const lh = fs * 1.35;
    const widest = Math.max(1, ...lines.map(l => ctx.measureText(l).width));
    const padX = L.box ? fs * 0.45 : fs * 0.12, padY = L.box ? fs * 0.22 : fs * 0.08;
    const bw = Math.min(W, widest + padX * 2), bh = lines.length * lh + padY * 2;
    const [left, top] = place(L, W, H, bw, bh);

    if (L.box) {
      ctx.fillStyle = hexA(L.boxColor, clamp(L.boxOpacity, 0, 100) / 100);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(left, top, bw, bh, fs * 0.22); else ctx.rect(left, top, bw, bh);
      ctx.fill();
    }
    ctx.textAlign = L.align;
    const tx = L.align === 'left' ? left + padX : L.align === 'right' ? left + bw - padX : left + bw / 2;

  }
  function freeName(used, base) {
    for (let i = 1; ; i++) {
      const name = `${base}${i > 1 ? ` (${i})` : ''}.mp4`;
      if (!used.has(name.toLowerCase())) { used.add(name.toLowerCase()); return name; }
    }
  }
  // Where the exported files go. Returns { label, open?, create(base) -> { name, target, discard(), finish() } }.
  async function chooseDest(MB) {
    const used = new Set();
    if (native) {
      const dir = await native.pickFolder();
      if (!dir) return null;
      return {
        label: `the "${dir.split(/[\\/]/).filter(Boolean).pop() || dir}" folder`, open: () => native.openFolder(dir),
        async create(base) {
          const f = await native.createFile(dir, base + '.mp4');
          const writable = new WritableStream({ write: c => native.write(f.id, c.data, c.position), close: () => native.close(f.id), abort: () => native.discard(f.id) });
          return { name: f.name, target: new MB.StreamTarget(writable, { chunked: true }), finish: async () => {}, discard: () => native.discard(f.id) };
        },
      };
    }
    if (window.showDirectoryPicker) {
      let dir = null;
      try { dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'videotext-out' }); }
      catch (e) { if (e && e.name === 'AbortError') return null; }
      if (dir) return {
        label: dir.name ? `the "${dir.name}" folder` : 'the folder you chose',
        async create(base) {
          let name;
          for (;;) { name = freeName(used, base); try { await dir.getFileHandle(name); } catch (e) { break; } }
          const handle = await dir.getFileHandle(name, { create: true });
          const writable = await handle.createWritable();
          return { name, target: new MB.StreamTarget(writable, { chunked: true }), finish: async () => {},
            discard: async () => { try { await writable.abort(); } catch (_) {} try { await dir.removeEntry(name); } catch (_) {} } };
        },
      };
    }
    return {
      label: 'your Downloads folder',
      async create(base) {
        const name = freeName(used, base), target = new MB.BufferTarget();
        return { name, target, discard: async () => {}, finish: async () => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([target.buffer], { type: 'video/mp4' })); a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
        } };
      },
    };
  }

  async function exportOne(MB, it, base, layers, dest, onProgress) {
    let out = null, input = null;
    try {
      input = new MB.Input({ source: new MB.BlobSource(it.file), formats: MB.ALL_FORMATS });
      const track = await input.getPrimaryVideoTrack();
      if (!track) throw new Error('No video track found in this file.');
      const W = track.displayWidth, H = track.displayHeight;
      const D = await input.computeDuration();

      let bitrate = ({ high: MB.QUALITY_HIGH, medium: MB.QUALITY_MEDIUM, small: MB.QUALITY_LOW })[state.quality] || MB.QUALITY_HIGH;
      if (state.quality === 'original') {
        try {
          const stats = await track.computePacketStats(150);
          if (stats && stats.averageBitrate > 0) bitrate = Math.round(clamp(stats.averageBitrate * 1.15, 1.5e6, 60e6));
        } catch (_) {}
      }

      const rendered = layers.map(L => ({ L, r: renderLayer(L, W, H) })).filter(x => x.r);
      const frame = new OffscreenCanvas(W, H);
      const fctx = frame.getContext('2d', { alpha: false });

      out = await dest.create(base);
      const output = new MB.Output({ format: new MB.Mp4OutputFormat(), target: out.target });
      const conversion = await MB.Conversion.init({
        input, output,
        video: {
          bitrate, forceTranscode: true, allowTransformationMetadata: false, processedWidth: W, processedHeight: H,
          process: sample => {
            sample.draw(fctx, 0, 0, W, H);
            const t = sample.timestamp;
            for (const { L, r } of rendered) {
              const a = alphaAt(L, t, D);
              if (a <= 0) continue;
              fctx.globalAlpha = a; fctx.drawImage(r.canvas, 0, 0);
            }
            fctx.globalAlpha = 1;
            return frame;
          },
        },
      });
      if (!conversion.isValid) throw new Error('This video format cannot be processed on this computer.');
      conversion.onProgress = onProgress;
      state.cancel = () => conversion.cancel();
      if (state.cancelled) throw new Error('cancelled');
      await conversion.execute();
      if (state.cancelled) throw new Error('cancelled');
      await out.finish();
      return out.name;
    } catch (e) {
      if (out) { try { await out.discard(); } catch (_) {} }
      throw e;
    } finally {
      state.cancel = null;
      try { input && input.dispose && input.dispose(); } catch (_) {}
    }
  }

  function eta(startedAt, fraction) {
    const el = (performance.now() - startedAt) / 1000;
    if (el < 3 || fraction < 0.03) return '…';
    const left = el / fraction - el;
    return left < 60 ? ` · about ${Math.max(1, Math.round(left))} s left` : ` · about ${Math.round(left / 60)} min left`;
  }

  async function exportAll() {
    if (state.busy || !state.items.length) return;
    if (typeof Mediabunny === 'undefined' || typeof VideoEncoder === 'undefined') {
      setMsg('Video export is not supported here. Open VideoText in Google Chrome or Microsoft Edge.', 'err');
      return;
    }
    const layers = state.layers.filter(layerHasContent).map(L => ({ ...L }));
    const items = state.items.slice();
    let dest;
    try { dest = await chooseDest(Mediabunny); } catch (e) { setMsg('Could not open that folder: ' + (e.message || e), 'err'); return; }
    if (!dest) return;

    state.cancelled = false; state.lastDest = null; $('openFolder').hidden = true;
    for (const it of items) { it.status = 'queued'; it.progress = 0; it.error = ''; }
    video.pause();
    setBusy(true);
    let done = 0, failed = 0;
    const total = items.length, startedAt = performance.now();
    const overall = p => { $('barfill').style.width = ((done + failed + p) / total * 100).toFixed(1) + '%'; };
    overall(0);

    for (let i = 0; i < total; i++) {
      const it = items[i];
      if (state.cancelled) { it.status = 'ready'; continue; }
      it.status = 'working'; renderList();
      const label = total > 1 ? `Exporting video ${i + 1} of ${total}` : 'Exporting';
      setMsg(label + '…');
      try {
        await exportOne(Mediabunny, it, outBase(it.file, i + 1), layers, dest, p => {
          it.progress = p; overall(p);
          if (!state.cancelled) setMsg(label + eta(startedAt, (done + failed + p) / total));
          const li = listEl.children[state.items.indexOf(it)];
          if (li) { li.querySelector('.st').textContent = Math.round(p * 100) + '%'; li.querySelector('.fill').style.width = (p * 100).toFixed(1) + '%'; }
        });
        it.status = 'done'; done++;
      } catch (e) {
        if (state.cancelled) it.status = 'ready';
        else { console.error(e); it.status = 'error'; it.error = (e && e.message) || String(e); failed++; }
      }
      overall(0); renderList();
    }

    setBusy(false);
    if (done && dest.open) { state.lastDest = dest; $('openFolder').hidden = false; }
    if (state.cancelled) setMsg(done ? `Cancelled. ${done} of ${total} saved to ${dest.label}.` : 'Cancelled.');
    else if (failed && !done) setMsg(total > 1 ? 'None of the videos could be exported. Hover a video to see why.' : 'Export failed: ' + items[0].error, 'err');
    else if (failed) setMsg(`${done} saved to ${dest.label}, ${failed} failed. Hover a failed video to see why.`, 'err');
    else setMsg(total > 1 ? `All ${done} videos saved to ${dest.label}.` : `Saved to ${dest.label}.`, 'ok');
  }

  $('export').addEventListener('click', exportAll);
  $('cancel').addEventListener('click', () => {
    state.cancelled = true; setMsg('Cancelling…');
    if (state.cancel) Promise.resolve(state.cancel()).catch(() => {});
  });
  $('openFolder').addEventListener('click', () => { if (state.lastDest && state.lastDest.open) state.lastDest.open(); });
  window.addEventListener('beforeunload', e => { if (state.busy) { e.preventDefault(); e.returnValue = ''; } });
  if (native && native.onStatus) native.onStatus(text => { if (!state.busy) setMsg(text); });

  // ---------- start ----------
  state.layers.push(newText()); state.selLayer = state.layers[0].id;
  renderLayers(); buildPanel(); renderList();
  if (native) loadAllFonts();          // the desktop app can list every installed font straight away
})();
</script>
</body>
</html>
